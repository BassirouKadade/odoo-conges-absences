# =====================================================================
#  Mini-projet Systèmes Intégrés – INSEA 2026/2027
#  Module Odoo : insea_hr_leave_custom (autorisations d'absence & congés)
#
#  Tous les noms (projet, conteneurs, volumes, réseau) sont préfixés
#  "insea-hr" pour ne jamais entrer en collision avec un autre projet
#  Odoo/PostgreSQL présent sur la même machine.
# =====================================================================

name: insea-hr-leave

services:

  db:
    image: postgres:16
    container_name: insea-hr-db
    environment:
      # Base "postgres" : Odoo crée lui-même ses bases depuis l'interface
      POSTGRES_DB: postgres
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - db-data:/var/lib/postgresql/data
    networks:
      - insea-hr-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d postgres"]
      interval: 10s
      start_period: 30s
      timeout: 5s
      retries: 10
    # Aucun port publié : PostgreSQL n'est joignable que par Odoo

  odoo:
    image: odoo:${ODOO_VERSION}
    container_name: insea-hr-odoo
    environment:
      HOST: db
      PORT: 5432
      USER: ${DB_USER}
      PASSWORD: ${DB_PASSWORD}
    volumes:
      - odoo-data:/var/lib/odoo
      - ./config:/etc/odoo
      - ./addons:/mnt/extra-addons
    networks:
      - insea-hr-net
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      mailpit:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:8069/web/health"]
      start_period: 30s
      interval: 30s
      timeout: 10s
      retries: 5
    ports:
      - "${ODOO_PORT}:8069"

  # Serveur SMTP factice : capture tous les e-mails envoyés par Odoo
  # et les affiche dans une boîte de réception web. Rien ne part sur Internet.
  mailpit:
    image: axllent/mailpit:v1.21.8
    container_name: insea-hr-mailpit
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: "1"
      MP_SMTP_AUTH_ALLOW_INSECURE: "1"
      MP_MAX_MESSAGES: "5000"
      TZ: Africa/Casablanca
    networks:
      - insea-hr-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 10s
      start_period: 5s
      timeout: 5s
      retries: 5
    ports:
      # Interface web uniquement ; le SMTP (1025) reste interne au réseau Docker
      - "${MAILPIT_PORT:-8025}:8025"

volumes:
  db-data:
    name: insea-hr-db-data
  odoo-data:
    name: insea-hr-odoo-data

networks:
  insea-hr-net:
    name: insea-hr-net
